[package]
name              = "nato-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface for converting text to the NATO phonetic alphabet"
keywords    = ["nato", "phonetic", "alphabet", "cli"]
categories  = ["command-line-utilities"]

[[bin]]
name = "nato"
path = "src/main.rs"

[dependencies]
nato.workspace = true
clap = { version = "4", features = ["derive"] }
