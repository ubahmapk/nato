# CHANGELOG automation for the workspace.
# This file lives in crates/nato/ so replacements run exactly once (nato is
# processed first in dependency order). Paths resolve relative to crates/nato/.

# Replace the sentinel + [Unreleased] heading in one pass:
# - Keep the sentinel (so future releases have an anchor)
# - Insert a fresh [Unreleased] section for the next release
# - Rename the current [Unreleased] to the versioned heading
[[pre-release-replacements]]
file    = "../../CHANGELOG.md"
search  = "<!-- next-header -->\n## \\[Unreleased\\]"
replace = "<!-- next-header -->\n## [Unreleased]\n\n## [{{version}}] - {{date}}"
exactly = 1

# Replace the [Unreleased] compare URL and prepend the new versioned link in one pass:
# - Keep the sentinel
# - Update [Unreleased] to point from the new tag to HEAD
# - Add the new [version] footer link above the existing entries
[[pre-release-replacements]]
file    = "../../CHANGELOG.md"
search  = "<!-- next-url -->\n\\[Unreleased\\]: https://github\\.com/ubahmapk/nato/compare/.*\\.\\.\\.HEAD"
replace = "<!-- next-url -->\n[Unreleased]: https://github.com/ubahmapk/nato/compare/{{tag_name}}...HEAD\n[{{version}}]: https://github.com/ubahmapk/nato/releases/tag/{{tag_name}}"
exactly = 1
